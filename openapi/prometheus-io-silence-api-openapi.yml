openapi: 3.2.0
info:
  version: 0.0.1
  title: Alertmanager Silence API
  description: API of the Prometheus Alertmanager (https://github.com/prometheus/alertmanager)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /api/v2/
tags:
- name: silence
  description: Everything related to Alertmanager silences
paths:
  /silences:
    get:
      tags:
      - silence
      operationId: getSilences
      description: Get a list of silences
      responses:
        '200':
          description: Get silences response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gettableSilences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      parameters:
      - name: filter
        in: query
        description: A matcher expression to filter silences. For example `alertname="MyAlert"`. It can be repeated to apply multiple matchers.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      summary: Get silences
      x-summary-source: derived
    post:
      tags:
      - silence
      operationId: postSilences
      description: Post a new silence or update an existing one
      responses:
        '200':
          description: Create / update silence response
          content:
            application/json:
              schema:
                type: object
                properties:
                  silenceID:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: A silence with the specified ID was not found
          content:
            application/json:
              schema:
                type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postableSilence'
        description: The silence to create
        required: true
      summary: Post silences
      x-summary-source: derived
  /silence/{silenceID}:
    parameters:
    - in: path
      name: silenceID
      required: true
      description: ID of the silence to get
      schema:
        type: string
        format: uuid
    get:
      tags:
      - silence
      operationId: getSilence
      description: Get a silence by its ID
      responses:
        '200':
          description: Get silence response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gettableSilence'
        '404':
          description: A silence with the specified ID was not found
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get silence
      x-summary-source: derived
    delete:
      tags:
      - silence
      operationId: deleteSilence
      description: Delete a silence by its ID
      parameters:
      - in: path
        name: silenceID
        required: true
        description: ID of the silence to get
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Delete silence response
        '404':
          description: A silence with the specified ID was not found
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Delete silence
      x-summary-source: derived
components:
  schemas:
    labelSet:
      type: object
      additionalProperties:
        type: string
    postableSilence:
      allOf:
      - type: object
        properties:
          id:
            type: string
      - $ref: '#/components/schemas/silence'
    silenceStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - expired
          - active
          - pending
      required:
      - state
    matcher:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        isRegex:
          type: boolean
        isEqual:
          type: boolean
          default: true
      required:
      - name
      - value
      - isRegex
    silence:
      type: object
      properties:
        matchers:
          $ref: '#/components/schemas/matchers'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdBy:
          type: string
        comment:
          type: string
        annotations:
          $ref: '#/components/schemas/labelSet'
      required:
      - matchers
      - startsAt
      - endsAt
      - createdBy
      - comment
    gettableSilences:
      type: array
      items:
        $ref: '#/components/schemas/gettableSilence'
    matchers:
      type: array
      items:
        $ref: '#/components/schemas/matcher'
      minItems: 1
    gettableSilence:
      allOf:
      - type: object
        properties:
          id:
            type: string
          status:
            $ref: '#/components/schemas/silenceStatus'
          updatedAt:
            type: string
            format: date-time
        required:
        - id
        - status
        - updatedAt
        - annotations
      - $ref: '#/components/schemas/silence'
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: string
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: string
