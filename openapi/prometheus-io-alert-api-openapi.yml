openapi: 3.2.0
info:
  version: 0.0.1
  title: Alertmanager Alert API
  description: API of the Prometheus Alertmanager (https://github.com/prometheus/alertmanager)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: /api/v2/
tags:
- name: Alert
  description: Everything related to Alertmanager alerts
paths:
  /alerts:
    get:
      tags:
      - Alert
      operationId: getAlerts
      description: Get a list of alerts
      parameters:
      - in: query
        name: active
        description: Include active alerts in results. If false, excludes active alerts and returns only suppressed (silenced or inhibited) alerts.
        schema:
          type: boolean
          default: true
      - in: query
        name: silenced
        description: Include silenced alerts in results. If false, excludes silenced alerts. Note that true (default) shows both silenced and non-silenced alerts.
        schema:
          type: boolean
          default: true
      - in: query
        name: inhibited
        description: Include inhibited alerts in results. If false, excludes inhibited alerts. Note that true (default) shows both inhibited and non-inhibited alerts.
        schema:
          type: boolean
          default: true
      - in: query
        name: unprocessed
        description: Include unprocessed alerts in results. If false, excludes unprocessed alerts. Note that true (default) shows both processed and unprocessed alerts.
        schema:
          type: boolean
          default: true
      - name: filter
        in: query
        description: A matcher expression to filter alerts. For example `alertname="MyAlert"`. It can be repeated to apply multiple matchers.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: receiver
        in: query
        description: A regex matching receivers to filter alerts by
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/receiverMatchers'
      responses:
        '200':
          description: Get alerts response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gettableAlerts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Get alerts
      x-summary-source: derived
    post:
      tags:
      - Alert
      operationId: postAlerts
      description: Create new Alerts
      responses:
        '200':
          description: Create alerts response
        '500':
          $ref: '#/components/responses/InternalServerError'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postableAlerts'
        description: The alerts to create
        required: true
      summary: Post alerts
      x-summary-source: derived
components:
  schemas:
    gettableAlert:
      allOf:
      - type: object
        properties:
          annotations:
            $ref: '#/components/schemas/labelSet'
          receivers:
            type: array
            items:
              $ref: '#/components/schemas/receiverReference'
          fingerprint:
            type: string
          startsAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
          endsAt:
            type: string
            format: date-time
          status:
            $ref: '#/components/schemas/alertStatus'
        required:
        - receivers
        - fingerprint
        - startsAt
        - updatedAt
        - endsAt
        - annotations
        - status
      - $ref: '#/components/schemas/alert'
    labelSet:
      type: object
      additionalProperties:
        type: string
    gettableAlerts:
      type: array
      items:
        $ref: '#/components/schemas/gettableAlert'
    alert:
      type: object
      properties:
        labels:
          $ref: '#/components/schemas/labelSet'
        generatorURL:
          type: string
          format: uri
      required:
      - labels
    postableAlerts:
      type: array
      items:
        $ref: '#/components/schemas/postableAlert'
    postableAlert:
      allOf:
      - type: object
        properties:
          startsAt:
            type: string
            format: date-time
          endsAt:
            type: string
            format: date-time
          annotations:
            $ref: '#/components/schemas/labelSet'
      - $ref: '#/components/schemas/alert'
    receiverReference:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    alertStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - unprocessed
          - active
          - suppressed
        silencedBy:
          type: array
          items:
            type: string
        inhibitedBy:
          type: array
          items:
            type: string
        mutedBy:
          type: array
          items:
            type: string
      required:
      - state
      - silencedBy
      - inhibitedBy
      - mutedBy
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: string
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: string
  parameters:
    receiverMatchers:
      name: receiver_matchers
      in: query
      description: A matcher expression to filter by receiver labels. For example `owner="my-team"`. Can be repeated to apply multiple matchers.
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
