    QueryData:
      anyOf:
      - type: object
        properties:
          resultType:
            type: string
            enum:
            - vector
          result:
            type: array
            items:
              anyOf:
              - $ref: '#/components/schemas/FloatSample'
              - $ref: '#/components/schemas/HistogramSample'
