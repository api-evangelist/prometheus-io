apis:
- aid: prometheus-io:prometheus-remote-write
  name: Prometheus Remote Write
  tags:
  - Remote Write
  - Ingest
  - Protocol Buffers
  - Streaming
  humanURL: https://prometheus.io/docs/specs/prw/remote_write_spec_2_0/
  description: >-
    Remote Write is Prometheus' push protocol for shipping scraped samples to long-term storage and analysis
    backends (Cortex, Thanos, Mimir, VictoriaMetrics, InfluxDB, Datadog, etc.). Snappy-compressed protocol-buffer
    payloads POSTed over HTTP. Version 1.0 is stable and widely implemented; version 2.0 (experimental
    specification) adds native histograms, metadata-per-series, created timestamps, and tighter validation.
  properties:
  - url: https://prometheus.io/docs/specs/prw/remote_write_spec/
    type: Documentation
    name: Remote Write 1.0 Specification
  - url: https://prometheus.io/docs/specs/prw/remote_write_spec_2_0/
    type: Documentation
    name: Remote Write 2.0 Specification
  - url: https://github.com/prometheus/prometheus/blob/main/prompb/remote.proto
    type: ProtoBuf
    name: remote.proto
- aid: prometheus-io:prometheus-exposition-format
  name: Prometheus Exposition Format / OpenMetrics
  tags:
  - Exposition
  - OpenMetrics
  - Scraping
  - Metrics Format
  humanURL: https://prometheus.io/docs/instrumenting/exposition_formats/
  description: >-
    The text-based exposition format that every instrumented target exposes (typically on /metrics) and
    that the Prometheus server scrapes over HTTP. The format evolved into OpenMetrics, a CNCF Sandbox
    specification that is the standardized successor; both are scrape-compatible with Prometheus. Defines
    counters, gauges, histograms, summaries, and (in OpenMetrics) info, stateset, gaugehistogram, and
    exemplars.
  properties:
  - url: https://prometheus.io/docs/instrumenting/exposition_formats/
    type: Documentation
  - url: https://openmetrics.io/
    type: Documentation
    name: OpenMetrics
  - url: https://github.com/prometheus/OpenMetrics
    type: SourceCode
    name: prometheus/OpenMetrics
- aid: prometheus-io:prometheus-otlp-receiver
  name: Prometheus OTLP Metrics Receiver
  tags:
  - OTLP
  - OpenTelemetry
  - Receiver
  - Ingest
  humanURL: https://prometheus.io/docs/prometheus/latest/feature_flags/
  description: >-
    Optional OpenTelemetry Protocol metrics receiver exposed on /api/v1/otlp/v1/metrics when the Prometheus
    server is started with --web.enable-otlp-receiver. Accepts OTLP/HTTP protobuf payloads from OpenTelemetry
    Collectors and SDKs; delta-to-cumulative conversion is available behind --enable-feature=otlp-deltatocumulative.
  properties:
  - url: https://prometheus.io/docs/guides/opentelemetry/
    type: Documentation
    name: OpenTelemetry Guide
  - url: https://github.com/open-telemetry/opentelemetry-proto
    type: SourceCode
    name: OTLP Protocol Buffers
